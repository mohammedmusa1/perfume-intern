name: AuraPerfume CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_ORG: auraperfume

jobs:
  # ── Build & Test ────────────────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, cart-service, order-service, payment-service, coupon-service, notification-service, admin-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: services/${{ matrix.service }}
      - name: Build
        run: npm run build
        working-directory: services/${{ matrix.service }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Docker Build & Push ─────────────────────────────────
  docker-push:
    needs: [build-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, cart-service, order-service, payment-service, coupon-service, notification-service, admin-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set context path
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=frontend" >> $GITHUB_OUTPUT
          else
            echo "path=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_ORG }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Kubernetes ────────────────────────────────
  deploy:
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update K8s manifests with new image tags
        run: |
          for service in api-gateway auth-service product-service cart-service order-service payment-service coupon-service notification-service admin-service frontend; do
            sed -i "s|auraperfume/${service}:latest|auraperfume/${service}:${{ github.sha }}|g" infrastructure/kubernetes/base/deployments.yaml
          done
      - name: Commit and push updated manifests
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add infrastructure/kubernetes/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
