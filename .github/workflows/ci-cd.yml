name: AuraPerfume CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: mohammedmusa1/perfume

jobs:
  # ── Build & Test ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: api-gateway
            path: services/api-gateway
          - name: auth-service
            path: services/auth-service
          - name: product-service
            path: services/product-service
          - name: cart-service
            path: services/cart-service
          - name: order-service
            path: services/order-service
          - name: payment-service
            path: services/payment-service
          - name: coupon-service
            path: services/coupon-service
          - name: notification-service
            path: services/notification-service
          - name: admin-service
            path: services/admin-service
          - name: frontend
            path: frontend
          - name: agent-codegen
            path: agents/codegen
          - name: agent-docker-monitor
            path: agents/docker-monitor
          - name: agent-k8s
            path: agents/k8s
          - name: agent-ci-cd
            path: agents/ci-cd
          - name: agent-observability
            path: agents/observability
          - name: agent-security
            path: agents/security
          - name: agent-cloud
            path: agents/cloud
          - name: agent-rollback
            path: agents/rollback
          - name: agent-notifier
            path: agents/notifier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── Trigger ArgoCD Sync ──────────────────────────────────
  sync-argocd:
    name: Trigger ArgoCD Sync
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Trigger ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          if [ -n "$ARGOCD_SERVER" ] && [ -n "$ARGOCD_TOKEN" ]; then
            argocd app sync auraperfume \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --insecure \
              --timeout 300 || echo "ArgoCD sync skipped (server not reachable)"
          else
            echo "ArgoCD credentials not configured — skipping sync"
          fi

  # ── Notify on failure ────────────────────────────────────
  notify-failure:
    name: Notify on Build Failure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed for commit ${{ github.sha }} by ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          # AutoOps notifier agent will pick this up via CI/CD monitoring
