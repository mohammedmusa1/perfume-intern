---
# ── codegen agent ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-codegen
  namespace: autoops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-codegen
  template:
    metadata:
      labels:
        app: agent-codegen
    spec:
      containers:
        - name: agent-codegen
          image: mohammedmusa1/perfume-agent-codegen:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
          envFrom:
            - configMapRef:
                name: autoops-config
            - secretRef:
                name: autoops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-codegen
  namespace: autoops
spec:
  selector:
    app: agent-codegen
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
# ── docker-monitor agent ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-docker-monitor
  namespace: autoops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-docker-monitor
  template:
    metadata:
      labels:
        app: agent-docker-monitor
    spec:
      containers:
        - name: agent-docker-monitor
          image: mohammedmusa1/perfume-agent-docker-monitor:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
          envFrom:
            - configMapRef:
                name: autoops-config
            - secretRef:
                name: autoops-secrets
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: agent-docker-monitor
  namespace: autoops
spec:
  selector:
    app: agent-docker-monitor
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
---
# ── k8s agent ────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoops-k8s-sa
  namespace: autoops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoops-k8s-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoops-k8s-rolebinding
subjects:
  - kind: ServiceAccount
    name: autoops-k8s-sa
    namespace: autoops
roleRef:
  kind: ClusterRole
  name: autoops-k8s-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-k8s
  namespace: autoops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-k8s
  template:
    metadata:
      labels:
        app: agent-k8s
    spec:
      serviceAccountName: autoops-k8s-sa
      containers:
        - name: agent-k8s
          image: mohammedmusa1/perfume-agent-k8s:latest
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
          envFrom:
            - configMapRef:
                name: autoops-config
            - secretRef:
                name: autoops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-k8s
  namespace: autoops
spec:
  selector:
    app: agent-k8s
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
---
