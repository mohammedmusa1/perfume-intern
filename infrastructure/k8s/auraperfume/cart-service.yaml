---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: auraperfume
  labels:
    app: cart-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: mohammedmusa1/perfume-cart-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: auraperfume-config
            - secretRef:
                name: auraperfume-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: auraperfume
spec:
  selector:
    app: cart-service
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP
