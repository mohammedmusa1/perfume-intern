---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auraperfume-config
  namespace: auraperfume
data:
  NODE_ENV: "production"
  APP_NAME: "AuraPerfume"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "http://localhost"
  METRICS_ENABLED: "true"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  REPORT_EMAIL: "shaikhmusa991@gmail.com"
  # Internal service URLs (within auraperfume namespace)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  CART_SERVICE_URL: "http://cart-service:3003"
  ORDER_SERVICE_URL: "http://order-service:3004"
  PAYMENT_SERVICE_URL: "http://payment-service:3005"
  COUPON_SERVICE_URL: "http://coupon-service:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3007"
  ADMIN_SERVICE_URL: "http://admin-service:3008"
  NEXT_PUBLIC_API_URL: "http://localhost/api"
  NEXT_PUBLIC_APP_URL: "http://localhost"
  PROMETHEUS_URL: "http://prometheus.monitoring:9090"
