apiVersion: v1
kind: Namespace
metadata:
  name: auraperfume
  labels:
    app: auraperfume
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auraperfume-config
  namespace: auraperfume
data:
  NODE_ENV: "production"
  API_GATEWAY_PORT: "3000"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  CART_SERVICE_URL: "http://cart-service:3003"
  ORDER_SERVICE_URL: "http://order-service:3004"
  PAYMENT_SERVICE_URL: "http://payment-service:3005"
  COUPON_SERVICE_URL: "http://coupon-service:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3007"
  ADMIN_SERVICE_URL: "http://admin-service:3008"
  CORS_ORIGIN: "https://auraperfume.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: auraperfume-secrets
  namespace: auraperfume
type: Opaque
stringData:
  DATABASE_URL: "postgresql://auraperfume_user:CHANGE_ME@postgres:5432/auraperfume"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  RAZORPAY_KEY_ID: "rzp_live_CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE_ME"
  RESEND_API_KEY: "re_CHANGE_ME"
