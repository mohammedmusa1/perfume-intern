# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: auraperfume
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: auraperfume/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.auraperfume.com/api"
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: auraperfume
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
