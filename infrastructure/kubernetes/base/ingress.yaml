apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auraperfume-ingress
  namespace: auraperfume
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auraperfume.com
        - api.auraperfume.com
      secretName: auraperfume-tls
  rules:
    - host: auraperfume.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.auraperfume.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
