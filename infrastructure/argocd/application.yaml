apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auraperfume
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mohammedmusa1/perfume-intern.git'
    targetRevision: main
    path: infrastructure/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: auraperfume
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
