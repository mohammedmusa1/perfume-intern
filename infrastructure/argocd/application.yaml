apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auraperfume
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/auraperfume.git
    targetRevision: main
    path: infrastructure/kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: auraperfume
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
